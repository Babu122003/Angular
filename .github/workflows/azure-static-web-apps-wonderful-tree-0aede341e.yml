name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ shopping-page ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ shopping-page ]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Sanity: show folder tree to ensure the app path is right
      - name: Debug – repo tree (top level)
        run: |
          pwd
          ls -la
          echo "---- shopping-cart content ----"
          ls -la ./shopping-cart || true

      - name: Install dependencies (Angular app)
        working-directory: ./shopping-cart
        run: npm ci

      - name: Build (Angular production)
        working-directory: ./shopping-cart
        run: npm run build

      # Sanity: confirm the expected dist path exists
      - name: Debug – built artifacts
        run: |
          echo "Listing dist paths…"
          ls -la ./shopping-cart/dist || true
          ls -la ./shopping-cart/dist/shopping-cart || true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_TREE_0AEDE341E }}
          action: upload
          app_location: ./shopping-cart
          output_location: dist/skillerexplorer
          # Force the action NOT to rebuild; use what we just built
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close