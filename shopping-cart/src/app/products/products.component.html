<div class="products-container">
  <div class="products-grid">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="product.image" [alt]="product.name">
      <div class="card-content">
        <h3>{{ product.name }}</h3>
        <p class="price">${{ product.price }}</p>
        <button (click)="addToCart(product)">Add to Cart</button>
      </div>
    </div>
  </div>

  <div class="cart-section" [class.show]="showCart">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button class="close-btn" (click)="toggleCart()">✕</button>
    </div>
    
    <div *ngIf="cartItems.length === 0" class="empty-cart">
      Your cart is empty
    </div>

    <div *ngIf="cartItems.length > 0">
      <div class="cart-item" *ngFor="let item of cartItems">
        <img [src]="item.image" [alt]="item.name">
        <div class="item-details">
          <h4>{{ item.name }}</h4>
          <p>${{ item.price }}</p>
        </div>
        <input type="number" [value]="item.quantity" 
               (change)="updateQuantity(item.id, $event)" min="1">
        <button class="remove-btn" (click)="removeFromCart(item.id)">Remove</button>
      </div>

      <div class="cart-total">
        <h3>Total: ${{ getTotal() }}</h3>
        <button class="checkout-btn" (click)="checkout()">Checkout</button>
        <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
      </div>
    </div>
  </div>

  <button class="floating-cart-btn" (click)="toggleCart()">
    🛒 Cart ({{ cartItems.length }})
  </button>
</div>
