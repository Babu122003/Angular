<div class="profile-container">
  <div class="profile-box">
    <div class="profile-header">
      <h1>👤 User Profile</h1>
    </div>
    
    <div class="profile-content" *ngIf="user">
      <div class="profile-avatar">
        <div class="avatar-circle">{{ user.name.charAt(0) }}</div>
      </div>
      
      <div class="profile-info">
        <div class="info-item">
          <label>Name:</label>
          <p>{{ user.name }}</p>
        </div>
        <div class="info-item">
          <label>Email:</label>
          <p>{{ user.email }}</p>
        </div>
        <div class="info-item">
          <label>Phone:</label>
          <p>{{ user.phone }}</p>
        </div>
        <div class="info-item">
          <label>Address:</label>
          <p>{{ user.address }}</p>
        </div>
      </div>

      <div class="profile-actions">
        <button class="back-btn" (click)="goBack()">Back to Shopping</button>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</div>
