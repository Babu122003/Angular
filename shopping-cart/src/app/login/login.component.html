<div class="login-container">
  <div class="login-left">
    <img src="https://th.bing.com/th/id/R.66064f0026b0a7cbff198437d76ec417?rik=HvUfn%2bvixkmV0g&pid=ImgRaw&r=0" alt="Shopping Cart">
  </div>
  <div class="login-right">
    <div class="login-box">
      <h1>Shopping Cart Login</h1>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <button type="submit">Login</button>

      </form>
    </div>
  </div>
</div>
