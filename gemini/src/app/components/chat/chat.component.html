<div class="chat-container">
  <div class="messages-container">
    <div class="empty-state" *ngIf="messages.length === 0">
      <i class="icon-chat"></i>
      <p>Start a conversation with Gemini</p>
    </div>
    
    <div class="message" *ngFor="let message of messages" [class.user-message]="message.role === 'user'" [class.assistant-message]="message.role === 'assistant'">
      <div class="message-header">
        <span class="role">{{ message.role === 'user' ? 'You' : 'Gemini' }}</span>
        <span class="timestamp">{{ message.timestamp | date: 'short' }}</span>
      </div>
      <div class="message-content">{{ message.content }}</div>
    </div>
    
    <div class="message assistant-message loading" *ngIf="isLoading">
      <div class="message-header">
        <span class="role">Gemini</span>
      </div>
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    
    <div class="error-message" *ngIf="error">
      <i class="icon-error"></i>
      {{ error }}
    </div>
  </div>
  
  <div class="input-container">
    <textarea
      [(ngModel)]="userInput"
      (keypress)="handleKeyPress($event)"
      placeholder="Ask Gemini anything..."
      class="message-input"
      rows="3"
    ></textarea>
    <button 
      (click)="sendMessage()" 
      [disabled]="isSendDisabled"
      class="send-button"
    >
      <i class="icon-send"></i>
      Send
    </button>
  </div>
</div>
